name: بناء ونشر تطبيق المعقل (أندرويد APK + ويب لآيفون والكمبيوتر)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # مزامنة يومية لنسخة الويب مع it-basra.com/amu (6 صباحاً بتوقيت بغداد)
    - cron: '7 3 * * *'

env:
  LIVE_BASE: https://it-basra.com/amu
  LIVE_FILES: index.html app.css sw.js offline.html manifest.webmanifest announcements.json icons/icon.svg icons/icon-192.png icons/icon-512.png icons/maskable-512.png icons/apple-touch-icon.png icons/favicon-32.png

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1) تجهيز ملفات الموقع + توليد الأيقونات تلقائياً إن لم تكن موجودة
  # ------------------------------------------------------------------
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: مزامنة الملفات من الموقع الرسمي it-basra.com/amu
        id: sync
        run: |
          mkdir -p /tmp/live/icons
          ok=1
          for f in $LIVE_FILES; do
            if ! curl -fsSL --retry 3 --retry-delay 5 --max-time 60 -A "Mozilla/5.0 (almaaqal-app sync)" "$LIVE_BASE/$f" -o "/tmp/live/$f"; then
              echo "::warning::تعذّر تنزيل $f من $LIVE_BASE"
              ok=0
            fi
          done
          if [ "$ok" = 1 ] && grep -qi '<html' /tmp/live/index.html && python3 -c "import json;json.load(open('/tmp/live/manifest.webmanifest',encoding='utf-8'));json.load(open('/tmp/live/announcements.json',encoding='utf-8'))"; then
            mkdir -p icons
            cp -r /tmp/live/. .
            echo "synced=1" >> "$GITHUB_OUTPUT"
            echo "تمت المزامنة من $LIVE_BASE"
          else
            echo "synced=0" >> "$GITHUB_OUTPUT"
            echo "::warning::تعذّرت المزامنة، استُخدمت الملفات الموجودة في المستودع"
          fi
          grep -o "VERSION = '[^']*'" sw.js || true

      - name: حفظ النسخة المحدّثة في المستودع
        if: steps.sync.outputs.synced == '1'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.css sw.js offline.html manifest.webmanifest announcements.json icons
          if git diff --cached --quiet; then
            echo "لا تغييرات جديدة"
          else
            git commit -m "مزامنة تلقائية من it-basra.com/amu"
            git push
          fi

      - name: أدوات الصور
        run: npm install --prefix /tmp/imgtool --no-audit --no-fund --no-save sharp@0.33

      - name: توليد الأيقونات (إن كان مجلد icons ناقصاً)
        run: |
          mkdir -p icons
          if [ ! -f icons/icon.svg ]; then
          cat > icons/icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBEB"/><stop offset=".35" stop-color="#FBBF24"/><stop offset=".7" stop-color="#D97706"/><stop offset="1" stop-color="#854D0E"/></linearGradient>
          <linearGradient id="n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141E38"/><stop offset="1" stop-color="#060A17"/></linearGradient></defs>
          <rect width="512" height="512" fill="url(#n)"/>
          <circle cx="256" cy="256" r="200" fill="none" stroke="url(#g)" stroke-width="10"/>
          <circle cx="256" cy="256" r="182" fill="none" stroke="url(#g)" stroke-width="3" stroke-dasharray="8 6"/>
          <circle cx="256" cy="200" r="40" fill="#FBBF24" opacity=".9"/>
          <polygon points="256,150 170,204 342,204" fill="url(#n)" stroke="url(#g)" stroke-width="7" stroke-linejoin="round"/>
          <rect x="166" y="206" width="180" height="12" rx="3" fill="url(#g)"/>
          <g fill="url(#g)"><rect x="176" y="222" width="16" height="78" rx="3"/><rect x="212" y="222" width="16" height="78" rx="3"/><rect x="248" y="222" width="16" height="78" rx="3"/><rect x="284" y="222" width="16" height="78" rx="3"/><rect x="320" y="222" width="16" height="78" rx="3"/>
          <rect x="162" y="300" width="188" height="10" rx="3"/><rect x="152" y="312" width="208" height="12" rx="3"/></g>
          <path d="M186 352 Q221 366 256 352 T326 352" fill="none" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round"/>
          <path d="M206 370 Q231 382 256 370 T306 370" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
          </svg>
          SVG
          fi
          cat > /tmp/imgtool/icons.js <<'JS'
          const sharp = require('sharp'); const fs = require('fs');
          const svg = fs.readFileSync('icons/icon.svg');
          const sizes = { 'icon-512.png': 512, 'icon-192.png': 192, 'apple-touch-icon.png': 180, 'favicon-32.png': 32 };
          (async () => {
            for (const [f, n] of Object.entries(sizes)) {
              if (!fs.existsSync('icons/' + f)) await sharp(svg, { density: 300 }).resize(n, n).png().toFile('icons/' + f);
            }
            if (!fs.existsSync('icons/maskable-512.png')) {
              const inner = await sharp(svg, { density: 300 }).resize(400, 400).png().toBuffer();
              await sharp({ create: { width: 512, height: 512, channels: 4, background: '#060A17' } })
                .composite([{ input: inner, gravity: 'center' }]).png().toFile('icons/maskable-512.png');
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          JS
          NODE_PATH=/tmp/imgtool/node_modules node /tmp/imgtool/icons.js
          ls -la icons

      - name: تجميع ملفات الموقع
        run: |
          mkdir -p site
          for f in index.html app.css sw.js offline.html manifest.webmanifest announcements.json; do
            if [ -f "$f" ]; then cp "$f" site/; else echo "::warning::الملف $f غير موجود"; fi
          done
          cp -r icons site/
          touch site/.nojekyll
          ls -la site

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          include-hidden-files: true

  # ------------------------------------------------------------------
  # 2) نشر نسخة الويب على GitHub Pages (آيفون + كمبيوتر + أندرويد)
  # ------------------------------------------------------------------
  pages:
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  # ------------------------------------------------------------------
  # 3) بناء ملف APK لأندرويد (تغليف التطبيق بـ Capacitor)
  # ------------------------------------------------------------------
  android:
    needs: site
    # المزامنة اليومية تحدّث الويب فقط؛ التطبيق يقرأ الموقع مباشرة فلا يحتاج إعادة بناء
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: www

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: إنشاء مشروع أندرويد
        run: |
          rm -f www/.nojekyll
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          # التطبيق يفتح الموقع الرسمي مباشرة، فأي تحديث على it-basra.com/amu يظهر فوراً دون إعادة بناء.
          # بعد أول تشغيل يعمل بدون إنترنت (النسخة المحفوظة)، وعند تعذّر الاتصال تظهر صفحة offline.html المضمّنة.
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "iq.edu.almaaqal.cyber",
            "appName": "المعقل",
            "webDir": "www",
            "server": {
              "url": "https://it-basra.com/amu/",
              "allowNavigation": ["it-basra.com"],
              "errorPath": "offline.html"
            },
            "android": { "backgroundColor": "#060A17" }
          }
          JSON
          npx cap add android
          npx cap sync android
          # رقم إصدار يزيد مع كل بناء حتى يقبله أندرويد كتحديث
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"2.2.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: أيقونة التطبيق
        run: |
          npm install --no-audit --no-fund --no-save sharp@0.33
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}; size=${d##*:}
            mkdir -p "$RES/mipmap-$name"
            node -e "require('sharp')('www/icons/icon-512.png').resize($size,$size).png().toFile('$RES/mipmap-$name/ic_launcher.png').catch(e=>{console.error(e);process.exit(1)})"
            cp "$RES/mipmap-$name/ic_launcher.png" "$RES/mipmap-$name/ic_launcher_round.png"
            rm -f "$RES/mipmap-$name/ic_launcher_foreground.png"
          done
          ls -la "$RES/mipmap-xxxhdpi"

      - name: بناء APK
        run: |
          cd android
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon --stacktrace && break
            if [ "$i" = 3 ]; then exit 1; fi
            echo "فشلت المحاولة $i، إعادة بعد دقيقة..."; sleep 60
          done
          cd ..
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/almaqal-app.apk
          ls -la dist

      - name: رفع الملف كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: almaqal-apk
          path: dist/*.apk

      - name: نشر الإصدار للتنزيل المباشر من الهاتف
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: نسخة رقم ${{ github.run_number }}
          body: |
            بوابة قسم هندسة الأمن السيبراني - جامعة المعقل الدولية.
            حمّل ملف almaqal-app.apk على هاتف أندرويد وثبّته.
            التطبيق يعرض الموقع الرسمي it-basra.com/amu مباشرة، فيصله كل تحديث تلقائياً.
            لآيفون والكمبيوتر: https://it-basra.com/amu/ (زر «تثبيت البوابة»).
          files: dist/*.apk
          make_latest: true
